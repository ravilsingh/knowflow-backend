server:
  port: 8080

spring:
  application:
    name: ai-knowledge-decision-assistant

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/knowledge_assistant}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt-secret: ${JWT_SECRET:local-development-secret-key-change-before-deploy-123456}

  # Public assistant URL must point to React frontend
  base-url: ${APP_BASE_URL:http://localhost:5173}

  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

  llm-base-url: ${LLM_BASE_URL:}
  llm-api-key: ${LLM_API_KEY:}
  llm-model: ${LLM_MODEL:gpt-4o-mini}
